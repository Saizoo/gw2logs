services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gw2logs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gw2logs}
      # Without an explicit locale, Alpine's initdb has no locale data to
      # work from and falls back to SQL_ASCII, which stores strings without
      # validating them as UTF-8. Character/guild names with accents or
      # other non-ASCII text then get written as raw invalid bytes that
      # Postgres itself accepts, but that the Prisma query engine cannot
      # decode back into a string on read. Force real UTF-8 so the database
      # rejects invalid text on write instead of failing later on read.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gw2logs}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gw2logs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gw2logs}?schema=public
      PORT: 4000
      NODE_ENV: production
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID in .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET in .env}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:?set DISCORD_REDIRECT_URI in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      # Comma-separated Discord user IDs (snowflakes, not usernames) — see
      # server/src/routes/auth.ts isBootstrapAdmin. Optional: an empty
      # value just means nobody gets auto-promoted on login.
      ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS:-}
      DEBUG_PRISMA_QUERIES: ${DEBUG_PRISMA_QUERIES:-}
    ports:
      - '127.0.0.1:4000:4000'
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
